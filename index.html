let x=170,y=250,frame=0;
const nori=document.getElementById("nori");
const sprite=document.getElementById("sprite");
const taiki=document.getElementById("taiki");
const taikiSprite=document.getElementById("taikiSprite");
let joined=false;
let trail=[];

function move(dx,dy,dir){
  const oldX=x, oldY=y;

  x=Math.max(0,Math.min(330,x+dx));
  y=Math.max(80,Math.min(450,y+dy));

  nori.style.left=x+"px";
  nori.style.top=y+"px";

  frame=1-frame;
  sprite.src=sprites[dir][frame];

  if(!joined){
    const dist=Math.hypot(x-285,y-125);

    if(dist<90){
      joined=true;
      trail=[
        {x:285,y:125},
        {x:285,y:125},
        {x:oldX,y:oldY}
      ];
      document.getElementById("message").innerHTML=
        "&#12383;&#12356;&#12365;&#12364;&#20210;&#38291;&#12395;&#12394;&#12387;&#12383;&#65281;";
    }
  }else{
    trail.push({x:oldX,y:oldY});
    if(trail.length>3) trail.shift();

    const follow=trail[0];
    taiki.style.left=follow.x+"px";
    taiki.style.top=follow.y+"px";
    taikiSprite.src=taikiSprites[dir][frame];

    document.getElementById("message").innerHTML=
      "&#12383;&#12356;&#12365;&#12364;&#12398;&#12426;&#12395;&#12388;&#12356;&#12390;&#12367;&#12427;&#65281;";
  }
}

/* ===== RPG V1 COMBAT ===== */
let slimeHPV1=3;
const slimeV1=document.getElementById("slimeV1");
const hpV1=document.getElementById("hpV1");
function attackV1(){
  if(slimeHPV1<=0)return;
  const sx=slimeV1.offsetLeft+35, sy=slimeV1.offsetTop+27;
  const nx=x+35, ny=y+40;
  const d=Math.hypot(nx-sx,ny-sy);
  if(d>115){
    document.getElementById("message").innerHTML="&#12473;&#12521;&#12452;&#12512;&#12395;&#23626;&#12363;&#12394;&#12356;&#65281;";
    return;
  }
  slimeHPV1--;
  hpV1.textContent=slimeHPV1;
  slimeV1.classList.remove("hitV1"); void slimeV1.offsetWidth; slimeV1.classList.add("hitV1");
  if(slimeHPV1<=0){
    slimeV1.classList.add("dead");
    document.getElementById("message").innerHTML="&#12473;&#12521;&#12452;&#12512;&#12434;&#12383;&#12362;&#12375;&#12383;&#65281;";
  }else{
    document.getElementById("message").innerHTML="&#12398;&#12426;&#12398;&#12371;&#12358;&#12370;&#12365;&#65281;";
  }
}
document.getElementById("attackV1").addEventListener("pointerdown",function(e){e.preventDefault();attackV1();});


function resetBattleV1(){
  slimeHPV1=3;
  hpV1.textContent="3";
  slimeV1.classList.remove("dead","hitV1");
  slimeV1.style.left="292px";
  slimeV1.style.top="245px";
  document.getElementById("message").innerHTML="&#12473;&#12521;&#12452;&#12512;&#12364;&#24489;&#27963;&#12375;&#12383;&#65281;";
}
document.getElementById("resetV1").addEventListener("pointerdown",function(e){
  e.preventDefault();
  resetBattleV1();
});

</script>
